# owner-contact-trace — credentials example
#
# THE REAL FILE LIVES OUTSIDE THE REPO. Copy this to ~/.owner-contact-trace/credentials.yaml
# (dir 0700, file 0600) and edit there. Never commit a real credentials file, and never place
# one in a synced tree.
#
# This file names KEY FILE PATHS, not key values. Scripts read the file at the named path;
# no key value ever appears in this file, in SKILL.md, or in source code.
#
# CLAUDE NEVER: handles a key value, enters a payment method, or provisions an account.
# Claude cannot install a key via Bash — the command classifier blocks commands that handle
# API key values — BUT THE WRITE TOOL CAN PLACE THE FILE. So the correct setup flow is:
# Mitch supplies the value, Claude writes it to the path with Write, then Mitch (or Claude)
# runs the chmod.
#
#   chmod 700 ~/.skipsherpa ~/.batchdata ~/.melissa
#   chmod 600 ~/.skipsherpa/key ~/.batchdata/key ~/.melissa/credits_key
#
# ~/.skipsherpa is still mode 755 while every other key dir is 700 — fix it before a run.

vendor_keys:
  skipsherpa:
    path: ~/.skipsherpa/key
    mode: "0600"
    dir_mode: "0700"
    header: "API-Key"          # NOT Bearer. All Sherpa calls are PUT.
    note: >
      BLOCKED as of 2026-08-11. Zero-cost re-probe: PUT /api/person {} — 403
      permission_denied_exception means dead. Two distinct dead-key strings mean different
      things: "API Key is not active or is not valid anymore" = recognized but deactivated;
      "Invalid API Key" = not recognized at all.

  batchdata:
    path: ~/.batchdata/key
    mode: "0600"
    dir_mode: "0700"
    header: "Authorization"    # Bearer
    note: >
      LIVE as of 2026-08-11 (POST {} returns 400 "The requests field is required"). The key
      file must have NO TRAILING NEWLINE. api.batchdata.io does not resolve — use
      api.batchdata.com. ROTATE THIS TOKEN: it was pasted into a chat transcript.

  melissa:
    path: ~/.melissa/credits_key
    mode: "0600"
    dir_mode: "0700"
    note: >
      BLOCKED as of 2026-08-11 (GE05). Zero-cost re-probe:
      GET usage.melissadata.net/v1/license?id=<key> — id alone, no t= parameter. Rejected
      keys cost $0. GE05/GE08 means skip silently and note the gap; any YS## means run
      melissa.py selftest (1 credit) before trusting it.
      TRAP: Melissa's "**" is part of the key, not masking. Keys are 24 chars ending "**",
      so an INTERIOR "**" means the field holds TWO keys run together.

# Published public-access credential. NOT a secret.
sunbiz:
  host: sftp.floridados.gov
  user: Public
  password: "PubAccess1845!"
  note: >
    Published by the State of Florida on dos.fl.gov as a public-access account. It is
    recorded here and in references/veil_piercing.md, labelled as such, because operators
    need to know it exists and is public. Code reads it from THIS FILE, never inline. If the
    credential ever changes, the publishing page 403s to plain curl — use the Browser pane,
    not WebFetch and not curl.
  file: doc/Quarterly/Cor/cordata.zip
  deltas: doc/cor/YYYYMMDDc.txt
  transport: >
    macOS curl has no sftp protocol. Drive /usr/bin/sftp under /usr/bin/expect —
    scripts/getcor.exp. Stream members with `unzip -p`, NEVER extract: the 18.5 GB expansion
    is prohibited anywhere.

# MCP connectors carry no key here — they are resolved at runtime.
mcp_connectors:
  note: >
    Apify, Zoho and Tracerfy are exposed under an opaque mcp__<uuid>__<toolname> prefix that
    differs per machine. NEVER hardcode the prefix. Resolve with ToolSearch keyword search;
    a bare select:mcp__apify__... fails because these tools are deferred. Placecraft, by
    contrast, is stably mcp__placecraft__*.
  resolve_with:
    apify: 'ToolSearch(query: "apify actor call dataset", max_results: 8)'
    zoho: 'ToolSearch(query: "zoho searchRecords COQL", max_results: 6)'
    tracerfy: 'ToolSearch(query: "tracerfy trace lookup dnc balance", max_results: 8)'

# Everything below is a ## Blocked on Mitch item. Claude never self-serves these.
blocked_on_mitch:
  - any vendor not already in references/source_ledger.md
  - any account provisioning, signup or payment method
  - OpenSOSData's 10 free lookups (require an account)
  - any DNC-scrub purchase
  - the NC bulk subscription ($2,750 year 1) — and ask NC SoS whether registered-agent
    address is a discrete column BEFORE paying
  - licensed title/skip platforms (DataTree, CLEAR, TLOxp, Accurint) pending licensing,
    contract scope and permissible-purpose confirmation
  - the dollar value of one Tracerfy credit
